title: Livewire Injection Stopper
description: "Laravel package that rejects listed User-Agents, listed IP addresses and arrays sent to scalar Livewire properties, keeps two bot-driven Livewire exceptions out of error tracking, and audits components for unlocked properties."
url: https://arviddejong.github.io
baseurl: /livewire-injection-stopper

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

# Facts about the package, used by the structured data and llms.txt.
package:
  name: darvis/livewire-injection-stopper
  repository: https://github.com/ArvidDeJong/livewire-injection-stopper
  packagist: https://packagist.org/packages/darvis/livewire-injection-stopper
  license_url: https://github.com/ArvidDeJong/livewire-injection-stopper/blob/main/LICENSE
  requires: PHP 8.2+, Laravel 11, 12 or 13, Livewire 3 or 4
  platforms: [Laravel, Livewire]
  keywords: [laravel, livewire, livewire security, middleware, bot blocking, user agent blocking, ip blocking, payload injection, locked properties, CannotUpdateLockedPropertyException, sentry noise, security audit]

# Developer credit in the footer and the structured data.
developer:
  company: ARVID.NL
  url: https://arvid.nl

color_scheme: light
search_enabled: true
heading_anchors: true

aux_links:
  GitHub: https://github.com/ArvidDeJong/livewire-injection-stopper
  Packagist: https://packagist.org/packages/darvis/livewire-injection-stopper
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/ArvidDeJong/livewire-injection-stopper
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/social-preview.png
