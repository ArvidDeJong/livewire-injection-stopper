# Questions as people ask them to an assistant. Short, factual answers.
# Rendered on faq.md, in the FAQPage structured data and in llms.txt.
- q: How do I block spam bots in a Laravel Livewire application?
  a: Install `darvis/livewire-injection-stopper`. Its middleware joins the `web` group automatically and rejects scripted clients such as python-requests, curl, wget and Go-http-client by their User-Agent, plus any IP addresses you list. No setup is needed.

- q: Does darvis/livewire-injection-stopper work with Livewire 4 and Laravel 13?
  a: Yes. It supports Livewire 3 and 4, Laravel 11, 12 and 13, and PHP 8.2 or higher. The Livewire update route is recognised by its route name, so a custom Livewire endpoint is inspected too.

- q: Will it block Googlebot or other search engines?
  a: No. The default list names specific SEO and AI crawlers (AhrefsBot, SemrushBot, GPTBot, ClaudeBot and others) and never generic words like "bot" or "crawler". If you add such a word yourself, put your uptime monitor in `allowed_user_agents` first.

- q: Why does Sentry keep reporting CannotUpdateLockedPropertyException?
  a: Bots replay Livewire requests with changed properties, and Livewire throws that exception for every `#[Locked]` property they touch. darvis/livewire-injection-stopper answers those requests with a 403, dispatches a `RequestBlocked` event and marks the exception as not reportable, so Sentry stays quiet.

- q: What is a Livewire payload injection?
  a: A request to Livewire's update endpoint that sends an array where the component expects a string, integer or boolean. It causes a `TypeError` during hydration or lets attackers probe property handling. The package rejects arrays sent to top-level properties before Livewire sees them.

- q: My multi-select stopped working after installing the package. Why?
  a: With `block_all_array_injections` enabled (the default), every array sent to a top-level Livewire property is rejected. Bind array properties under a nested key such as `form.tags`, or set that option to false so only known scalar names and prefixes like `is_` and `show_` are checked.

- q: How do I find Livewire properties that should be #[Locked]?
  a: Run `php artisan livewire-injection-stopper:audit`. It scans `app/Livewire` and `app/Traits` for public typed properties with a default value whose name looks sensitive (admin, role, price limits, user, cart and more) and exits with code 1 when it finds one, so it fits in CI.

- q: Does it use JavaScript, cookies or an external service?
  a: No. Everything runs in a middleware and an exception handler on your own server. There is no client-side code and no request to a third party.

- q: How is it different from darvis/livewire-honeypot?
  a: They complement each other. The honeypot protects forms against bots that fill in fields. This package blocks scripted clients and manipulated Livewire payloads at the request level, silences the resulting exceptions and audits components for unlocked properties.

- q: How do I log or count blocked requests?
  a: Listen for `Darvis\LivewireInjectionStopper\Events\RequestBlocked`. It carries the `reason` (`blocked_ip`, `blocked_user_agent`, `suspicious_payload` or `locked_property`), the `ip`, the `userAgent`, the `url` and, for silenced exceptions, the `exception`. A warning is also written to the log unless `log_blocked_requests` is false.

- q: Can a bot get around it?
  a: Yes, by sending a browser User-Agent. The User-Agent check removes the noise from scripts that don't bother; it is not a web application firewall. Combine it with `#[Locked]` properties, rate limiting and a honeypot on forms.
